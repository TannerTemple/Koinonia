packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - unrs-resolver
# Security fixes in packages we do not depend on directly (docs/REVIEW2.md).
overrides:
  deepmerge-ts: ^8.0.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
