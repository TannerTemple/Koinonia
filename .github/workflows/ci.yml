# Runs the same check a developer runs locally (`pnpm check`: lint, typecheck, all tests)
# on every push and pull request, against a real PostgreSQL.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koinonia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The API tests apply migrations to this database themselves.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koinonia_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koinonia_test

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        run: pnpm check

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the API
        run: pnpm --filter @koinonia/api build
      - name: Build the web app
        run: pnpm --filter @koinonia/web build
      - name: Bundle the iOS app
        run: pnpm --filter @koinonia/mobile export:ios
